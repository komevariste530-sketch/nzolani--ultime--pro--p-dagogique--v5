services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: nzolani_v5
      POSTGRES_USER: nzolani
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-nzolani_dev_password}
    volumes:
      - nzolani_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nzolani -d nzolani_v5"]
      interval: 10s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
volumes:
  nzolani_pgdata:
